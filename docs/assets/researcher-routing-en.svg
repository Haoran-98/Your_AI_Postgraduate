<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Assign the right postgraduate before research begins</title>
<desc id="desc">Exactly two levels: broad postgraduate → peer research lines; shared capability, isolated evidence ownership</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17212B" flood-opacity="0.10"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7B8794"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}.title{font-size:38px;font-weight:700;fill:#17212B}.subtitle{font-size:18px;fill:#5B6773}.eyebrow{font-size:14px;font-weight:700;fill:#087F73}.card-title{font-size:21px;font-weight:700;fill:#17212B}.compact{font-size:17px;font-weight:700;fill:#17212B}.body{font-size:16px;fill:#5B6773}.small{font-size:14px;fill:#5B6773}.step{font-size:13px;font-weight:700;fill:#FFFFFF}.white{fill:#FFFFFF}.mono{font-family:"Noto Sans Mono CJK SC","SFMono-Regular",Consolas,monospace}</style>
</defs>
<rect width="1600" height="900" fill="#F7F8FA"/>
<text x="90" y="64" class="eyebrow" text-anchor="start">RESEARCHER ASSIGNMENT GATE</text>
<text x="90" y="112" class="title" text-anchor="start">Assign the right postgraduate before research begins</text>
<text x="90" y="148" class="subtitle" text-anchor="start">Exactly two levels: broad postgraduate → peer research lines; shared capability, isolated evidence ownership</text>
<line x1="90" y1="176" x2="1510" y2="176" stroke="#CAD2DA" stroke-width="1"/>
<rect x="90" y="235" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#CAD2DA" stroke-width="1" filter="url(#shadow)"/>
<rect x="112" y="255" width="112" height="30" rx="8" fill="#17212B"/>
<text x="168" y="276" class="small" text-anchor="middle" style="fill:#FFFFFF">NEW TASK</text>
<text x="112" y="313" class="compact" text-anchor="start">
<tspan x="112" dy="0">Question + goal</tspan>
<tspan x="112" dy="25">+ constraints</tspan>
</text>
<text x="112" y="365" class="body" text-anchor="start">No literature work yet</text>
<rect x="440" y="220" width="360" height="250" rx="8" fill="#F4F7FB" stroke="#AFC3DB" stroke-width="1" filter="url(#shadow)"/>
<text x="466" y="265" class="card-title" text-anchor="start">Fit audit</text>
<circle cx="470" cy="305" r="5" fill="#246BCE"/>
<text x="486" y="310" class="body" text-anchor="start">Does domain ownership match?</text>
<circle cx="470" cy="342" r="5" fill="#246BCE"/>
<text x="486" y="347" class="body" text-anchor="start">Is stored knowledge directly transferable?</text>
<circle cx="470" cy="379" r="5" fill="#246BCE"/>
<text x="486" y="384" class="body" text-anchor="start">Do profile / index / hot / RAG match?</text>
<circle cx="470" cy="416" r="5" fill="#246BCE"/>
<text x="486" y="421" class="body" text-anchor="start">Generic method overlap is insufficient</text>
<line x1="344" y1="310" x2="428" y2="310" stroke="#7B8794" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="900" y="220" width="610" height="540" rx="8" fill="#FFFFFF" stroke="#CAD2DA" stroke-width="1" filter="url(#shadow)"/>
<text x="930" y="265" class="card-title" text-anchor="start">Persist the assignment</text>
<text x="930" y="298" class="small mono" text-anchor="start">wiki/meta/&lt;idea-id&gt;-postgraduate-assignment.md</text>
<rect x="950" y="338" width="510" height="92" rx="6" fill="#EAF7F5" stroke="#91C8C1" stroke-width="1"/>
<text x="1205" y="375" class="card-title" text-anchor="middle">Postgraduate_&lt;BroadDomain&gt;</text>
<text x="1205" y="404" class="small" text-anchor="middle">Level 1: domain researcher with shared knowledge and RAG</text>
<rect x="935" y="500" width="160" height="118" rx="6" fill="#FFF9ED" stroke="#D7C28D" stroke-width="1"/>
<text x="1015" y="542" class="compact" text-anchor="middle">Research line A</text>
<text x="1015" y="572" class="small" text-anchor="middle">
<tspan x="1015" dy="0">Own paper master</tspan>
<tspan x="1015" dy="20">claims</tspan>
</text>
<line x1="1205" y1="430" x2="1015" y2="500" stroke="#7B8794" stroke-width="2"/>
<rect x="1115" y="500" width="160" height="118" rx="6" fill="#FFF9ED" stroke="#D7C28D" stroke-width="1"/>
<text x="1195" y="542" class="compact" text-anchor="middle">Research line B</text>
<text x="1195" y="572" class="small" text-anchor="middle">
<tspan x="1195" dy="0">Own hypotheses</tspan>
<tspan x="1195" dy="20">experiments</tspan>
</text>
<line x1="1205" y1="430" x2="1195" y2="500" stroke="#7B8794" stroke-width="2"/>
<rect x="1295" y="500" width="160" height="118" rx="6" fill="#F3F1F8" stroke="#BFAED5" stroke-width="1"/>
<text x="1375" y="534" class="compact" text-anchor="middle">
<tspan x="1375" dy="0">New research</tspan>
<tspan x="1375" dy="21">line</tspan>
</text>
<text x="1375" y="586" class="small" text-anchor="middle">
<tspan x="1375" dy="0">Own evidence provenance</tspan>
</text>
<line x1="1205" y1="430" x2="1375" y2="500" stroke="#7B8794" stroke-width="2"/>
<line x1="930" y1="665" x2="1480" y2="665" stroke="#D94841" stroke-width="3" stroke-dasharray="10 8"/>
<text x="1205" y="700" class="compact" text-anchor="middle" style="fill:#D94841">No third level: research lines cannot contain nested projects</text>
<line x1="804" y1="310" x2="888" y2="310" stroke="#7B8794" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="454" y="510" width="155" height="30" rx="8" fill="#087F73"/>
<text x="531" y="531" class="small" text-anchor="middle" style="fill:#FFFFFF">REUSE</text>
<text x="454" y="566" class="small" text-anchor="start">
<tspan x="454" dy="0">Domain + direct</tspan>
<tspan x="454" dy="22">evidence match</tspan>
</text>
<rect x="630" y="510" width="155" height="30" rx="8" fill="#C47A00"/>
<text x="707" y="531" class="small" text-anchor="middle" style="fill:#FFFFFF">CREATE</text>
<text x="630" y="566" class="small" text-anchor="start">
<tspan x="630" dy="0">No current</tspan>
<tspan x="630" dy="22">researcher fits</tspan>
</text>
<text x="90" y="530" class="body" text-anchor="start">
<tspan x="90" dy="0">Share domain knowledge</tspan>
<tspan x="90" dy="35">Isolate project evidence</tspan>
<tspan x="90" dy="35">Preserve provenance</tspan>
</text>
</svg>
